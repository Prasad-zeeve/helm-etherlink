apiVersion: v1
kind: Service
metadata:
  name: {{ include "etherlink-evm.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "etherlink-evm.name" . }}
  ports:
    - name: rpc
      port: {{ .Values.service.rpcPort }}
    - name: ws
      port: {{ .Values.service.wsPort }}
    - name: metrics
      port: {{ .Values.service.metricsPort }}
